<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nela's Kitchenette — Order Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
  body { background:#FAF9F6; color:#3A342C; }

  .hero { background:linear-gradient(180deg,#FF8C42,#FF6B35); color:#fff; text-align:center;
          padding:28px 20px 24px; }
  .hero img { width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid #fff;
              box-shadow:0 2px 8px rgba(0,0,0,0.25); }
  .hero h1 { font-size:22px; margin-top:10px; }
  .hero p { font-size:13px; opacity:0.9; margin-top:4px; }

  .offers { background:#FFF1E8; color:#FF6B35; font-size:13px; font-weight:bold; text-align:center;
            padding:10px; }

  .categoryBar { display:flex; overflow-x:auto; gap:10px; padding:14px 16px; background:#fff;
                 border-bottom:1px solid #EEEAE4; }
  .categoryChip { flex-shrink:0; padding:8px 16px; border-radius:20px; background:#F0EDE8;
                  font-size:14px; cursor:pointer; white-space:nowrap; }
  .categoryChip.active { background:#FF6B35; color:#fff; font-weight:bold; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px;
          padding:16px; max-width:900px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; border:1px solid #EEEAE4; overflow:hidden;
          display:flex; flex-direction:column; }
  .cardPhoto { width:100%; height:110px; background:#F0EDE8; position:relative; }
  .addBtn { position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
            background:#FF6B35; color:#fff; border:none; font-size:18px; font-weight:bold;
            cursor:pointer; }
  .cardBody { padding:10px 12px 14px; }
  .cardBody .name { font-size:14px; font-weight:bold; }
  .cardBody .price { font-size:14px; font-weight:bold; color:#FF6B35; margin-top:3px; }
  .cardBody .rating { font-size:12px; color:#9A9184; margin-top:3px; }

  .cartBar { position:fixed; left:0; right:0; bottom:0; background:#FF6B35; color:#fff;
             padding:14px 20px; font-weight:bold; font-size:15px; display:none;
             justify-content:space-between; align-items:center; cursor:pointer; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none;
             align-items:flex-end; justify-content:center; z-index:10; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
           padding:20px; max-height:82vh; overflow-y:auto; }
  .sheet h2 { font-size:18px; margin-bottom:12px; }
  .cartLine { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #F0EDE8; }
  .cartLine .lname { flex:1; font-size:14px; font-weight:bold; }
  .stepBtn { width:28px; height:28px; border-radius:50%; background:#FFF1EB; border:none;
             color:#FF6B35; font-weight:bold; font-size:15px; cursor:pointer; }
  .qty { width:26px; text-align:center; font-weight:bold; }
  .ltotal { width:70px; text-align:right; font-weight:bold; font-size:14px; }

  .field { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #E5E1DA;
           font-size:14px; margin-bottom:10px; }
  textarea.field { min-height:60px; resize:vertical; }

  .bigBtn { width:100%; padding:14px; border-radius:12px; border:none; background:#FF6B35;
            color:#fff; font-weight:bold; font-size:15px; cursor:pointer; margin-top:6px; }
  .secondaryBtn { width:100%; padding:12px; border-radius:12px; border:none; background:#F0EDE8;
                  color:#3A342C; font-weight:bold; font-size:14px; cursor:pointer; margin-top:8px; }

  .totalsRow { display:flex; justify-content:space-between; font-size:14px; margin-top:4px; }
  .totalsRow.grand { font-size:17px; font-weight:bold; color:#FF6B35; margin-top:10px; }

  .toggleGroup { display:flex; gap:10px; margin-bottom:14px; }
  .toggleOpt { flex:1; padding:12px; border-radius:12px; border:2px solid #F0EDE8; text-align:center;
               font-size:13px; font-weight:bold; cursor:pointer; }
  .toggleOpt.selected { border-color:#FF6B35; color:#FF6B35; background:#FFF1EB; }

  .confirmBox { text-align:center; padding:30px 10px; }
  .confirmBox .big { font-size:22px; font-weight:bold; color:#FF6B35; }

  .detailOptions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .optChip { padding:8px 14px; border-radius:16px; background:#F0EDE8; font-size:13px; cursor:pointer; }
  .optChip.selected { background:#FF6B35; color:#fff; font-weight:bold; }
</style>
</head>
<body>

<div class="hero">
  <img src="/chef_photo.png" alt="">
  <h1 id="restaurantName">Nela's Kitchenette</h1>
  <p>Order online — pickup, dine-in, or delivery</p>
</div>

<div class="offers" id="offersBar" style="display:none;"></div>

<div class="categoryBar" id="categoryBar"></div>
<div class="grid" id="grid"></div>

<div class="cartBar" id="cartBar" onclick="openCart()">
  <span id="cartBarText">Cart</span>
  <span>View Cart →</span>
</div>

<!-- Item detail sheet -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <h2 id="detailName"></h2>
    <p id="detailDescription" style="font-size:13px;color:#9A9184;margin-top:4px;"></p>
    <div id="detailOptions" class="detailOptions"></div>
    <div style="display:flex;align-items:center;gap:14px;margin:14px 0;">
      <button class="stepBtn" onclick="changeDetailQty(-1)">−</button>
      <span id="detailQty" class="qty">1</span>
      <button class="stepBtn" onclick="changeDetailQty(1)">+</button>
    </div>
    <button class="bigBtn" id="detailAddBtn" onclick="confirmAddToCart()">Add to Cart</button>
    <button class="secondaryBtn" onclick="closeOverlay('detailOverlay')">Cancel</button>
  </div>
</div>

<!-- Cart sheet -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <h2>Your Order</h2>
    <div id="cartLines"></div>
    <div style="margin-top:10px;">
      <input class="field" id="couponInput" placeholder="Coupon code">
      <button class="secondaryBtn" onclick="applyCoupon()">Apply Coupon</button>
      <p id="couponStatus" style="font-size:12px;margin-top:6px;"></p>
    </div>
    <div class="totalsRow"><span>Subtotal</span><span id="subtotalText">₱0.00</span></div>
    <div class="totalsRow" id="discountRow" style="display:none;"><span>Discount</span><span id="discountText"></span></div>
    <div class="totalsRow grand"><span>Total</span><span id="totalText">₱0.00</span></div>
    <button class="bigBtn" onclick="goToCheckout()">Checkout</button>
    <button class="secondaryBtn" onclick="closeOverlay('cartOverlay')">Continue Browsing</button>
  </div>
</div>

<!-- Checkout sheet -->
<div class="overlay" id="checkoutOverlay">
  <div class="sheet">
    <h2>Checkout</h2>
    <div class="toggleGroup">
      <div class="toggleOpt selected" id="optPickup" onclick="selectFulfillment('pickup')">🏠 Pickup / Dine-in</div>
      <div class="toggleOpt" id="optDelivery" onclick="selectFulfillment('delivery')">🛵 Delivery</div>
    </div>
    <input class="field" id="customerName" placeholder="Your name">
    <input class="field" id="customerPhone" placeholder="Phone number">
    <textarea class="field" id="customerAddress" placeholder="Delivery address (if applicable)"></textarea>
    <div class="totalsRow grand"><span>Total</span><span id="checkoutTotalText">₱0.00</span></div>
    <button class="bigBtn" onclick="placeOrder()">Place Order</button>
    <button class="secondaryBtn" onclick="closeOverlay('checkoutOverlay')">Back</button>
  </div>
</div>

<!-- Confirmation sheet -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet confirmBox">
    <h2>Order Confirmed! 🎉</h2>
    <p class="big" id="orderNumberText"></p>
    <p style="margin-top:10px;color:#9A9184;font-size:14px;">We'll contact you shortly to confirm your order.</p>
    <button class="bigBtn" onclick="startNewOrder()">Order Again</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
