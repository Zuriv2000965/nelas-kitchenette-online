<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nela's Kitchenette — Admin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
  body { background:#FAF9F6; color:#3A342C; padding:20px; }
  h1 { font-size:20px; margin-bottom:16px; color:#FF6B35; }
  .tabs { display:flex; gap:10px; margin-bottom:16px; }
  .tab { padding:10px 18px; border-radius:10px; background:#F0EDE8; cursor:pointer; font-weight:bold; font-size:14px; }
  .tab.active { background:#FF6B35; color:#fff; }
  .category { background:#fff; border-radius:12px; border:1px solid #EEEAE4; margin-bottom:14px; padding:14px 16px; }
  .categoryHeader { display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:15px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:8px 0 8px 16px;
          border-top:1px solid #F5F2EC; font-size:14px; }
  .switch { position:relative; width:44px; height:24px; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:0.2s; }
  .slider::before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff;
                     border-radius:50%; transition:0.2s; }
  input:checked + .slider { background:#FF6B35; }
  input:checked + .slider::before { transform:translateX(20px); }
  .orderCard { background:#fff; border-radius:12px; border:1px solid #EEEAE4; padding:14px 16px; margin-bottom:12px; }
  .orderCard .num { font-weight:bold; color:#FF6B35; }
  .orderCard .meta { font-size:12px; color:#9A9184; margin-top:2px; }
  .orderCard .line { font-size:13px; margin-top:6px; }
  #loginBox { max-width:320px; margin:80px auto; text-align:center; }
  #loginBox input { width:100%; padding:12px; border-radius:10px; border:1px solid #E5E1DA; margin-bottom:10px; }
  #loginBox button { width:100%; padding:12px; border-radius:10px; border:none; background:#FF6B35; color:#fff;
                      font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>Admin Login</h1>
  <input type="password" id="passwordInput" placeholder="Admin password">
  <button onclick="login()">Log In</button>
  <p id="loginError" style="color:#E85A2A;font-size:13px;margin-top:8px;"></p>
</div>

<div id="adminContent" style="display:none;">
  <h1>Nela's Kitchenette — Admin</h1>
  <div class="tabs">
    <div class="tab active" id="tabMenu" onclick="showTab('menu')">Menu Visibility</div>
    <div class="tab" id="tabOrders" onclick="showTab('orders')">Orders</div>
  </div>

  <div id="menuTab"></div>
  <div id="ordersTab" style="display:none;"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
