<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nela's Kitchenette — Admin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
  body { background:#FAF9F6; color:#3A342C; padding:20px; }
  h1 { font-size:20px; margin-bottom:16px; color:#FF6B35; }
  h2 { font-size:16px; margin-bottom:10px; color:#3A342C; }
  .tabs { display:flex; gap:10px; margin-bottom:16px; }
  .tab { padding:10px 18px; border-radius:10px; background:#F0EDE8; cursor:pointer; font-weight:bold; font-size:14px; }
  .tab.active { background:#FF6B35; color:#fff; }
  .category { background:#fff; border-radius:12px; border:1px solid #EEEAE4; margin-bottom:14px; padding:14px 16px; }
  .categoryHeader { display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:15px; gap:10px; }
  .categoryHeaderLeft { display:flex; align-items:center; gap:8px; flex:1; }
  .switch { position:relative; width:44px; height:24px; flex-shrink:0; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:0.2s; }
  .slider::before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff;
                     border-radius:50%; transition:0.2s; }
  input:checked + .slider { background:#FF6B35; }
  input:checked + .slider::before { transform:translateX(20px); }
  .orderCard { background:#fff; border-radius:12px; border:1px solid #EEEAE4; padding:14px 16px; margin-bottom:12px; }
  .orderCard .num { font-weight:bold; color:#FF6B35; }
  .orderCard .meta { font-size:12px; color:#9A9184; margin-top:2px; }
  .orderCard .line { font-size:13px; margin-top:6px; }
  #loginBox { max-width:320px; margin:80px auto; text-align:center; }
  #loginBox input { width:100%; padding:12px; border-radius:10px; border:1px solid #E5E1DA; margin-bottom:10px; }
  #loginBox button { width:100%; padding:12px; border-radius:10px; border:none; background:#FF6B35; color:#fff;
                      font-weight:bold; cursor:pointer; }
  .passwordWrap { position:relative; }
  .passwordWrap input { padding-right:44px !important; }
  #loginBox .togglePw { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none;
              width:24px; height:24px; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #loginBox .togglePw svg { width:20px; height:20px; }
  .itemRow { display:flex; align-items:center; gap:8px; padding:10px 0 10px 16px; border-top:1px solid #F5F2EC; flex-wrap:wrap; }
  .itemThumb { width:40px; height:40px; border-radius:8px; background:#F0EDE8; object-fit:cover; flex-shrink:0; }
  .itemName { flex:1; font-size:14px; min-width:100px; }
  .itemPrice { font-size:12px; color:#9A9184; }
  .smallBtn { padding:6px 10px; border-radius:8px; border:none; font-size:12px; font-weight:bold; cursor:pointer; }
  .photoBtn { background:#F0EDE8; color:#3A342C; }
  .editBtn { background:#E8F4FD; color:#2E7BB5; }
  .deleteBtn { background:#FDEAE5; color:#E85A2A; }
  .addBtnRow { text-align:right; margin:10px 0; }
  .addBtn { background:#FF6B35; color:#fff; padding:8px 16px; border-radius:8px; border:none; font-weight:bold;
            font-size:13px; cursor:pointer; }
  .field { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #E5E1DA; font-size:14px; margin-bottom:10px; }
  textarea.field { min-height:60px; resize:vertical; }

  .modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none;
                  align-items:center; justify-content:center; z-index:20; padding:20px; }
  .modalBox { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:420px; max-height:85vh; overflow-y:auto; }
  .modalBox h2 { color:#FF6B35; }
  .modalActions { display:flex; gap:10px; margin-top:14px; }
  .modalActions button { flex:1; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; }
  .saveModalBtn { background:#FF6B35; color:#fff; }
  .cancelModalBtn { background:#F0EDE8; color:#3A342C; }
  .choiceRow { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .choiceRow input { flex:1; }
  .choiceRow .removeChoiceBtn { background:#FDEAE5; color:#E85A2A; border:none; border-radius:8px; padding:8px 10px;
                                  font-weight:bold; cursor:pointer; }
  .checkboxRow { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14px; }

  .settingsSection { background:#fff; border-radius:12px; border:1px solid #EEEAE4; padding:16px; margin-bottom:14px; }
  .listRow { display:flex; gap:8px; margin-bottom:8px; }
  .listRow input { flex:1; }
  .listRow button { background:#FDEAE5; color:#E85A2A; border:none; border-radius:8px; padding:8px 12px;
                     font-weight:bold; cursor:pointer; }
  .couponRow input:first-child { flex:2; }
  .couponRow input:nth-child(2) { flex:1; }
  .addSmallLink { background:none; border:none; color:#FF6B35; font-weight:bold; font-size:13px; cursor:pointer;
                   padding:4px 0; margin-bottom:10px; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>Admin Login</h1>
  <div class="passwordWrap">
    <input type="password" id="passwordInput" placeholder="Admin password">
    <button type="button" class="togglePw" id="togglePwButton" onclick="togglePasswordVisibility()">
      <svg id="eyeIcon" viewBox="0 0 24 24" fill="#9A9184">
        <path d="M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5c-1.73,-4.39 -6,-7.5 -11,-7.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zM12,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z"/>
      </svg>
    </button>
  </div>
  <button onclick="login()">Log In</button>
  <p id="loginError" style="color:#E85A2A;font-size:13px;margin-top:8px;"></p>
</div>

<div id="adminContent" style="display:none;">
  <h1>Nela's Kitchenette — Admin</h1>
  <div class="tabs">
    <div class="tab active" id="tabMenu" onclick="showTab('menu')">Menu</div>
    <div class="tab" id="tabSettings" onclick="showTab('settings')">Store Settings</div>
    <div class="tab" id="tabOrders" onclick="showTab('orders')">Orders</div>
  </div>

  <div id="menuTab"></div>
  <div id="settingsTab" style="display:none;"></div>
  <div id="ordersTab" style="display:none;"></div>
</div>

<input type="file" id="photoFileInput" accept="image/*" style="display:none;">

<!-- Add/Edit Item modal -->
<div class="modalOverlay" id="itemModalOverlay">
  <div class="modalBox">
    <h2 id="itemModalTitle">Add Item</h2>
    <input class="field" id="itemNameInput" placeholder="Item name">
    <textarea class="field" id="itemDescInput" placeholder="Description"></textarea>
    <input class="field" id="itemPriceInput" type="number" step="0.01" placeholder="Price (₱)">

    <div class="checkboxRow">
      <input type="checkbox" id="itemHasOptions" onchange="toggleOptionsEditor()">
      <label for="itemHasOptions">This item has size/customization choices</label>
    </div>

    <div id="optionsEditor" style="display:none;">
      <input class="field" id="optionGroupNameInput" placeholder="Option group name (e.g. Size)">
      <div id="choicesContainer"></div>
      <button type="button" class="addSmallLink" onclick="addChoiceRow('', 0)">+ Add Choice</button>
    </div>

    <div class="modalActions">
      <button class="cancelModalBtn" onclick="closeItemModal()">Cancel</button>
      <button class="saveModalBtn" onclick="saveItemModal()">Save</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
